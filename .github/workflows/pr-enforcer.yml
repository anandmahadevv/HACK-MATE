name: PR Enforcer (Advanced OSS Protection)

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest

    steps:
      - name: Validate, Label, Assign and Control PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const body = pr.body || "";
            const title = (pr.title || "").toLowerCase();

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const lowerBody = body.toLowerCase();

            // =====================================================
            // 🔍 ISSUE VALIDATION
            // =====================================================

            const match = body.match(
              /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/i
            );

            let issueNumber = match ? parseInt(match[3]) : null;

            let issueExists = false;
            let issueOpen = false;

            if (issueNumber) {
              try {
                const issue = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                });

                // Ensure it is NOT another PR
                if (!issue.data.pull_request) {
                  issueExists = true;

                  if (issue.data.state === "open") {
                    issueOpen = true;
                  }
                }

              } catch (err) {
                issueExists = false;
              }
            }

            // =====================================================
            // 🏷️ ADVANCED LABEL SYSTEM
            // =====================================================

            let labels = [];

            // -------------------------
            // TYPE LABELS
            // -------------------------

            if (
              title.includes("fix") ||
              lowerBody.includes("bug") ||
              lowerBody.includes("error")
            ) {
              labels.push("bug");
            }

            if (
              title.includes("feat") ||
              title.includes("feature") ||
              lowerBody.includes("enhancement")
            ) {
              labels.push("enhancement");
            }

            if (
              lowerBody.includes("docs") ||
              lowerBody.includes("documentation") ||
              title.includes("readme")
            ) {
              labels.push("documentation");
            }

            if (
              lowerBody.includes("refactor") ||
              title.includes("cleanup")
            ) {
              labels.push("refactor");
            }

            if (
              lowerBody.includes("test") ||
              title.includes("test")
            ) {
              labels.push("test");
            }

            if (
              lowerBody.includes("security") ||
              lowerBody.includes("vulnerability")
            ) {
              labels.push("security");
            }

            if (
              lowerBody.includes("dependency") ||
              lowerBody.includes("package") ||
              title.includes("deps")
            ) {
              labels.push("dependencies");
            }

            // -------------------------
            // AREA LABELS
            // -------------------------

            if (
              lowerBody.includes("frontend") ||
              lowerBody.includes("ui") ||
              lowerBody.includes("css") ||
              lowerBody.includes("tailwind") ||
              lowerBody.includes("design")
            ) {
              labels.push("frontend");
              labels.push("ui/ux");
            }

            if (
              lowerBody.includes("backend") ||
              lowerBody.includes("api") ||
              lowerBody.includes("server")
            ) {
              labels.push("backend");
            }

            if (
              lowerBody.includes("database") ||
              lowerBody.includes("schema") ||
              lowerBody.includes("sql")
            ) {
              labels.push("database");
            }

            if (lowerBody.includes("firebase")) {
              labels.push("firebase");
            }

            if (lowerBody.includes("supabase")) {
              labels.push("supabase");
            }

            if (
              lowerBody.includes("ai") ||
              lowerBody.includes("openai") ||
              lowerBody.includes("prompt")
            ) {
              labels.push("ai");
            }

            if (
              lowerBody.includes("workflow") ||
              lowerBody.includes("github action") ||
              lowerBody.includes("ci")
            ) {
              labels.push("workflow");
            }

            if (
              lowerBody.includes("resource") ||
              lowerBody.includes(".md")
            ) {
              labels.push("resources");
            }

            // -------------------------
            // PRIORITY LABELS
            // -------------------------

            if (
              lowerBody.includes("urgent") ||
              lowerBody.includes("critical")
            ) {
              labels.push("priority: critical");
            } else if (
              lowerBody.includes("important")
            ) {
              labels.push("priority: high");
            } else {
              labels.push("priority: medium");
            }

            // -------------------------
            // STATUS LABELS
            // -------------------------

            labels.push("needs review");

            // Remove duplicate labels
            labels = [...new Set(labels)];

            // =====================================================
            // ❌ INVALID ISSUE → CLOSE PR
            // =====================================================

            if (!issueExists || !issueOpen) {

              labels.push("invalid");

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels
              });

              let reason = !issueExists
                ? "does not reference a valid issue"
                : "references a closed issue";

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  `❌ This PR has been automatically closed because it ${reason}.\n\n` +
                  `### Required Format\n` +
                  `Please link an OPEN issue using:\n\n` +
                  `\`Closes #issue_number\`\n\n` +
                  `After fixing the PR description, you may reopen the PR.`
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: "closed"
              });

              return;
            }

            // =====================================================
            // ✅ VALID PR
            // =====================================================

            labels.push("valid");

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels
            });

            // =====================================================
            // 👤 AUTO ASSIGN
            // =====================================================

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: prNumber,
              assignees: [owner]
            });

            // =====================================================
            // 💬 SUCCESS COMMENT
            // =====================================================

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body:
                `✅ PR validation passed.\n\n` +
                `- Linked issue verified\n` +
                `- Labels applied\n` +
                `- Ready for maintainer review 🚀`
            });
