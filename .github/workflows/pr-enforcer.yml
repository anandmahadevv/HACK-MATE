name: PR Enforcer

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest

    steps:
      - name: Validate and Manage PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const body = pr.body || "";
            const title = (pr.title || "").toLowerCase();

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const lowerBody = body.toLowerCase();

            // =====================================================
            // 🔍 ISSUE VALIDATION
            // =====================================================

            const match = body.match(
              /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/i
            );

            let issueNumber = match ? parseInt(match[3]) : null;

            let validIssue = false;

            if (issueNumber) {
              try {

                const issue = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                });

                // Ensure linked item is an ISSUE and OPEN
                if (
                  !issue.data.pull_request &&
                  issue.data.state === "open"
                ) {
                  validIssue = true;
                }

              } catch (err) {
                validIssue = false;
              }
            }

            // =====================================================
            // ❌ INVALID PR → COMMENT + CLOSE
            // =====================================================

            if (!validIssue) {

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  "❌ This PR has been automatically closed.\n\n" +
                  "Reason:\n" +
                  "- No valid OPEN issue linked\n\n" +
                  "Please link an open issue using:\n\n" +
                  "`Closes #issue_number`\n\n" +
                  "You can reopen the PR after updating the description."
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: "closed"
              });

              return;
            }

            // =====================================================
            // 🏷️ SMART LABELING
            // =====================================================

            let labels = [];

            // 🐛 BUG
            if (
              title.includes("fix") ||
              lowerBody.includes("bug") ||
              lowerBody.includes("error")
            ) {
              labels.push("bug");
            }

            // ✨ ENHANCEMENT
            if (
              title.includes("feat") ||
              title.includes("feature") ||
              lowerBody.includes("enhancement")
            ) {
              labels.push("enhancement");
            }

            // 📚 DOCUMENTATION
            if (
              lowerBody.includes("documentation") ||
              lowerBody.includes("docs") ||
              title.includes("readme")
            ) {
              labels.push("documentation");
            }

            // ♻️ REFACTOR
            if (
              lowerBody.includes("refactor") ||
              title.includes("cleanup")
            ) {
              labels.push("refactor");
            }

            // 🔐 SECURITY
            if (
              lowerBody.includes("security") ||
              lowerBody.includes("vulnerability")
            ) {
              labels.push("security");
            }

            // 🎨 FRONTEND
            if (
              lowerBody.includes("frontend") ||
              lowerBody.includes("ui") ||
              lowerBody.includes("react") ||
              lowerBody.includes("tailwind") ||
              lowerBody.includes("css")
            ) {
              labels.push("frontend");
            }

            // ⚙️ BACKEND
            if (
              lowerBody.includes("backend") ||
              lowerBody.includes("api") ||
              lowerBody.includes("server")
            ) {
              labels.push("backend");
            }

            // 🗄️ DATABASE
            if (
              lowerBody.includes("database") ||
              lowerBody.includes("sql") ||
              lowerBody.includes("schema") ||
              lowerBody.includes("firebase") ||
              lowerBody.includes("supabase")
            ) {
              labels.push("database");
            }

            // 🤖 AI
            if (
              lowerBody.includes("ai") ||
              lowerBody.includes("openai") ||
              lowerBody.includes("prompt")
            ) {
              labels.push("ai");
            }

            // ⚙️ WORKFLOW
            if (
              lowerBody.includes("workflow") ||
              lowerBody.includes("github action") ||
              lowerBody.includes("ci")
            ) {
              labels.push("workflow");
            }

            // Remove duplicates
            labels = [...new Set(labels)];

            // =====================================================
            // 🏷️ APPLY LABELS
            // =====================================================

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels
              });
            }

            // =====================================================
            // 👤 AUTO ASSIGN OWNER
            // =====================================================

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: prNumber,
              assignees: [owner]
            });

            // =====================================================
            // 💬 SUCCESS COMMENT
            // =====================================================

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body:
                "✅ PR validation passed.\n\n" +
                "- Open issue verified\n" +
                "- Relevant labels applied\n" +
                "- Ready for maintainer review 🚀"
            });